name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  golden:
    name: Golden-value regression suite
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest we exercise in CI (pyproject declares >=3.8, and 3.8 still works
        # locally); 3.12 catches NumPy 2.x / SciPy API drift early. The runner is pinned per
        # version because ubuntu-latest moved to 26.04, which no longer ships a 3.9 build —
        # Python 3.9 reached end of life in October 2025.
        include:
          - python-version: "3.9"
            runner: ubuntu-22.04
          - python-version: "3.12"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the analysis engine
        working-directory: RAATPackv3/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the golden-value suite
        working-directory: RAATPackv3/backend
        # These tests read "Demo Data/" from the repository root and assert every
        # module against the numbers printed in the Version 2 summary reports.
        run: python -m pytest -q

      - name: Verify every bundled sample file
        working-directory: RAATPackv3/backend
        # Loads and analyses all 42 sample files through the application's own code path and
        # prints a per-module table. It overlaps the suite above by design: this is the
        # artefact a human reads when something breaks.
        run: python -m scripts.verify_demo_data

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: RAATPackv3/frontend/package-lock.json

      - name: Install
        working-directory: RAATPackv3/frontend
        run: npm ci

      - name: Type-check
        working-directory: RAATPackv3/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: RAATPackv3/frontend
        run: npm run build
